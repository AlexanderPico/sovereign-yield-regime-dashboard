name: weekly-gold-watch

# Weekly Gold Reset Watch. Rebuilds the data bundle, diffs the gold-reset-watch
# lens against the committed state file, and opens a GitHub issue ONLY when the
# watcher reports a meaningful development (exit code 10). Price drift inside an
# existing threshold band exits 0 and stays silent by design.

on:
  workflow_dispatch:
  schedule:
    # Mondays 15:40 UTC, after the weekly WGCAL gold-certificate level posts.
    - cron: '40 15 * * 1'

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-gold-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild dashboard data
        run: python scripts/build_dashboard_data.py

      - name: Run weekly gold watch
        id: watch
        run: |
          set +e
          python scripts/weekly_gold_watch.py --always-print > gold-watch-report.md
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "10" ]; then
            echo "watcher failed with exit $code"
            cat gold-watch-report.md || true
            exit "$code"
          fi
          echo "meaningful=$([ "$code" = "10" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat gold-watch-report.md

      - name: Commit updated watch state
        run: |
          if git diff --quiet -- .gold-watch-state.json; then
            echo "no state change to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .gold-watch-state.json
          git commit -m 'chore: update gold watch state'
          git push

      # The report is generated by our own script from FRED/Yahoo numeric data,
      # never from user-controlled event payloads, so it is safe to pass through
      # an env var into the issue body.
      - name: Open issue on meaningful development
        if: steps.watch.outputs.meaningful == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Gold Reset Watch: meaningful development $(date -u +%Y-%m-%d)" \
            --body-file gold-watch-report.md \
            --label gold-watch || \
          gh issue create \
            --title "Gold Reset Watch: meaningful development $(date -u +%Y-%m-%d)" \
            --body-file gold-watch-report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-watch-report
          path: gold-watch-report.md
